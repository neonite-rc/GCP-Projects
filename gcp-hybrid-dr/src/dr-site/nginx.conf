# DR maintenance page — every path returns the maintenance page with
# HTTP 503 + Retry-After (correct semantics for an outage: search engines
# and API clients must not cache the maintenance page as real content).
# /health returns 200 so Cloud Run's own health checking stays green.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","site":"dr"}';
    }

    error_page 503 /index.html;

    location / {
        add_header Retry-After 300 always;
        return 503;
    }

    location = /index.html {
        internal;
    }
}
