# nginx reverse proxy for the primary-site app.
# Installed to /etc/nginx/sites-available/dr-app by the startup script.
# Port 80 only: no TLS cert without a real registered domain (documented in
# docs/03-security.md — 443 stays closed until a domain exists).

server {
    listen 80 default_server;
    server_name _;

    # Hide the nginx version from probes
    server_tokens off;

    # Health endpoint for the Cloud DNS failover health check.
    # Proxied to the app (not answered by nginx) so a dead app/database
    # fails the check and triggers failover.
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
