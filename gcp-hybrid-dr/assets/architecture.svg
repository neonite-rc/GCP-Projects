<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>
  <text x="640" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">gcp-hybrid-dr — Hybrid Cloud Disaster Recovery</text>
  <text x="640" y="68" text-anchor="middle" font-size="14" fill="#475569">Measured RPO 2.7h &#183; RTO 461s = 7m41s (live drill) &#183; $0.53/mo &#183; 100% Terraform</text>

  <!-- ======================= USERS ======================= -->
  <rect x="55" y="95" width="170" height="52" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Users</text>
  <text x="140" y="136" text-anchor="middle" font-size="11" fill="#475569">app.example.com</text>

  <!-- ======================= CLOUD DNS ======================= -->
  <rect x="430" y="88" width="420" height="66" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="640" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Cloud DNS — alert-driven CNAME failover</text>
  <text x="640" y="133" text-anchor="middle" font-size="12" fill="#1e40af">uptime check on /health &#183; TTL 300s &#183; no domain needed</text>

  <line x1="225" y1="121" x2="428" y2="121" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- healthy path -->
  <path d="M 520 154 L 350 205" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="215" y="163" width="210" height="22" rx="6" fill="#dcfce7"/>
  <text x="320" y="178" text-anchor="middle" font-size="11" fill="#166534">CNAME &#8594; primary.&#60;zone&#62; (A &#8594; VM IP)</text>

  <!-- failover path -->
  <path d="M 760 154 L 1010 205" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow-red)"/>
  <rect x="800" y="163" width="270" height="22" rx="6" fill="#fee2e2"/>
  <text x="935" y="178" text-anchor="middle" font-size="11" fill="#991b1b">CNAME &#8594; &#60;standby&#62;.a.run.app</text>

  <!-- ======================= PRIMARY SITE ======================= -->
  <rect x="50" y="215" width="580" height="360" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="none"/>
  <text x="75" y="245" font-size="16" font-weight="bold" fill="#1e3a8a">PRIMARY SITE — simulated on-prem (us-east1)</text>

  <!-- VM -->
  <rect x="85" y="270" width="250" height="110" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">e2-micro VM (static IP)</text>
  <text x="210" y="318" text-anchor="middle" font-size="12" fill="#334155">Flask + nginx reverse proxy</text>
  <text x="210" y="337" text-anchor="middle" font-size="12" fill="#334155">SQLite database</text>
  <text x="210" y="356" text-anchor="middle" font-size="11" fill="#16a34a">/health verifies the DB, not just HTTP</text>

  <!-- shielded/write-only notes -->
  <text x="210" y="398" text-anchor="middle" font-size="10.5" fill="#64748b">Shielded VM &#183; SSH admin-IP-only &#183; near-zero-role SA</text>

  <!-- backup.sh -->
  <rect x="85" y="425" width="250" height="115" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="450" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#0f172a">backup.sh — nightly cron</text>
  <text x="210" y="470" text-anchor="middle" font-size="11.5" fill="#334155">(02:00 UTC, on the VM)</text>
  <text x="210" y="492" text-anchor="middle" font-size="11.5" fill="#334155">SQLite online backup &#8594; gzip</text>
  <text x="210" y="510" text-anchor="middle" font-size="11.5" fill="#334155">&#8594; sha256 &#8594; CRC32C-validated upload</text>
  <text x="210" y="528" text-anchor="middle" font-size="10.5" fill="#64748b">no app downtime during backup</text>

  <line x1="210" y1="380" x2="210" y2="423" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- backup bucket -->
  <rect x="385" y="415" width="220" height="135" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="495" y="441" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#065f46">GCS: backups (Standard)</text>
  <text x="495" y="463" text-anchor="middle" font-size="11.5" fill="#047857">CMEK-encrypted (Cloud KMS)</text>
  <text x="495" y="481" text-anchor="middle" font-size="11.5" fill="#047857">object versioning</text>
  <text x="495" y="499" text-anchor="middle" font-size="11.5" fill="#047857">30-day lifecycle retention</text>
  <text x="495" y="517" text-anchor="middle" font-size="11" fill="#b91c1c">VM can only CREATE objects</text>
  <text x="495" y="534" text-anchor="middle" font-size="11" fill="#b91c1c">(cannot read/delete = ransomware-proof)</text>

  <line x1="335" y1="482" x2="383" y2="482" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ======================= DR SITE ======================= -->
  <rect x="655" y="215" width="575" height="360" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="680" y="245" font-size="16" font-weight="bold" fill="#92400e">DR SITE (us-west1)</text>

  <!-- Cloud Run -->
  <rect x="945" y="270" width="255" height="110" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="1072" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Cloud Run: maintenance page</text>
  <text x="1072" y="318" text-anchor="middle" font-size="12" fill="#334155">"Under Maintenance" static page</text>
  <text x="1072" y="337" text-anchor="middle" font-size="12" fill="#334155">scale-to-zero — $0/mo until failover</text>
  <text x="1072" y="356" text-anchor="middle" font-size="11" fill="#64748b">zero-role runtime service account</text>

  <!-- replica bucket -->
  <rect x="685" y="415" width="230" height="135" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="800" y="441" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#065f46">GCS: backups-replica (Nearline)</text>
  <text x="800" y="463" text-anchor="middle" font-size="11.5" fill="#047857">CMEK key in dr-region keyring</text>
  <text x="800" y="481" text-anchor="middle" font-size="11.5" fill="#047857">object versioning</text>
  <text x="800" y="499" text-anchor="middle" font-size="11.5" fill="#047857">30-day retention</text>
  <text x="800" y="521" text-anchor="middle" font-size="11" fill="#64748b">$0.01/GB-mo — half of Standard,</text>
  <text x="800" y="537" text-anchor="middle" font-size="11" fill="#64748b">read only during a disaster</text>

  <!-- STS arrow between buckets -->
  <line x1="605" y1="482" x2="683" y2="482" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="644" y="462" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">STS</text>

  <!-- restore path replica -> DR page? no; instead label restore flow -->
  <text x="1072" y="425" text-anchor="middle" font-size="11" fill="#64748b">Restore path:</text>
  <text x="1072" y="443" text-anchor="middle" font-size="11" fill="#64748b">download &#8594; checksum verify</text>
  <text x="1072" y="461" text-anchor="middle" font-size="11" fill="#64748b">&#8594; PRAGMA integrity_check</text>
  <text x="1072" y="479" text-anchor="middle" font-size="11" fill="#64748b">&#8594; rebuild VM from backup</text>

  <!-- ======================= MONITORING BAND ======================= -->
  <rect x="50" y="620" width="1180" height="235" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="75" y="650" font-size="16" font-weight="bold" fill="#5b21b6">MONITORING &amp; ALERTING — active RPO enforcement</text>

  <!-- Scheduler -->
  <rect x="85" y="675" width="195" height="62" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="182" y="700" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">Cloud Scheduler</text>
  <text x="182" y="720" text-anchor="middle" font-size="11.5" fill="#334155">03:00 UTC daily tick</text>

  <!-- Pub/Sub -->
  <rect x="320" y="675" width="150" height="62" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="395" y="700" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">Pub/Sub topic</text>
  <text x="395" y="720" text-anchor="middle" font-size="11.5" fill="#334155">freshness-tick</text>

  <!-- Function -->
  <rect x="510" y="675" width="290" height="62" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="655" y="700" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f172a">Cloud Function: backup freshness</text>
  <text x="655" y="720" text-anchor="middle" font-size="11.5" fill="#334155">newest backup older than RPO target?</text>

  <!-- Alert -->
  <rect x="840" y="675" width="185" height="62" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="932" y="700" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#991b1b">RPO breach alert</text>
  <text x="932" y="720" text-anchor="middle" font-size="11.5" fill="#991b1b">log metric &#8594; policy &#8594; email</text>

  <!-- Uptime/CPU/log sink -->
  <rect x="1065" y="675" width="140" height="62" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1135" y="697" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Uptime check /health</text>
  <text x="1135" y="714" text-anchor="middle" font-size="10.5" fill="#334155">CPU &gt;90% alert</text>
  <text x="1135" y="731" text-anchor="middle" font-size="10.5" fill="#334155">firewall-deny log sink</text>

  <line x1="280" y1="706" x2="318" y2="706" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="706" x2="508" y2="706" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="706" x2="838" y2="706" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- function inspects backup bucket -->
  <path d="M 655 673 L 495 552" stroke="#7c3aed" stroke-width="1.75" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="530" y="612" text-anchor="middle" font-size="10.5" fill="#6b21a8">lists newest object age</text>

  <!-- uptime check watches primary health (routed around containers) -->
  <path d="M 1135 673 L 1135 598 L 150 598 L 150 578" stroke="#7c3aed" stroke-width="1.75" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="642" y="591" text-anchor="middle" font-size="10.5" fill="#6b21a8">uptime checks probe http://primary-ip/health every 60s from 3 US regions</text>

  <!-- legend -->
  <text x="75" y="785" font-size="11.5" fill="#475569">&#8212;&#8212;&#9654; steady-state flow&#160;&#160;&#160;&#160;</text>
  <text x="280" y="785" font-size="11.5" fill="#dc2626">- - &#9654; disaster-time flow</text>
  <text x="470" y="785" font-size="11.5" fill="#7c3aed">- - &#9654; monitoring probes</text>
  <text x="660" y="785" font-size="11.5" fill="#334155">Disaster timeline: last backup 02:00 &#8594; attack/failure &#8594; health check fails (&#8804;90s) &#8594;</text>
  <text x="660" y="803" font-size="11.5" fill="#334155">DNS TTL expiry (300s) &#8594; traffic on Cloud Run DR page. Measured RTO 461s, RPO 2.7h (live drill 2026-10-21).</text>

  <text x="640" y="862" text-anchor="middle" font-size="11" fill="#94a3b8">Source: terraform/ (modules: primary-site, backup, dr-site, dns) &#183; docs/01-architecture.md</text>
</svg>
